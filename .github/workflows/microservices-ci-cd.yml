name: Microservices CI/CD

on:
  push:
    branches: ["main", "microservices"]
  pull_request:
    branches: ["main"]

jobs:
  test-auth-service:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: auth-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: auth-service/requirements.txt
      - run: pip install -r requirements.txt pytest flake8
      - name: Lint
        run: flake8 . --max-line-length=120 --extend-ignore=E203,W503 --exclude=venv
      - name: Test
        env:
          JWT_SECRET_KEY: ci-test-jwt-secret
          INTERNAL_SERVICE_KEY: ci-test-internal-key
        run: pytest tests.py -v

  test-admin-service:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: admin-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: admin-service/requirements.txt
      - run: pip install -r requirements.txt flake8
      - name: Lint
        run: flake8 . --max-line-length=120 --extend-ignore=E203,W503 --exclude=migrations,venv
      - name: Test
        env:
          SECRET_KEY: ci-test-secret
          JWT_SECRET_KEY: ci-test-jwt-secret
          INTERNAL_SERVICE_KEY: ci-test-internal-key
        run: |
          python manage.py migrate
          python manage.py test users -v 2

  build-and-push-images:
    needs: [test-auth-service, test-admin-service]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        service: [auth-service, admin-service, gateway]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.service }}
          push: true
          tags: ghcr.io/${{ github.repository }}/${{ matrix.service }}:latest
